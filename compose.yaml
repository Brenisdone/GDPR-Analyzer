
services:
  postgres:
    image: postgres:16
    container_name: gdpr-analyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdpr_analyzer
      POSTGRES_USER: gdpr_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gdpr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdpr_user -d gdpr_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gdpr_postgres_data:
